<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Automation Tools</title>
<meta name="description" content="Conveyor speed, sensor timing, transfer gap, drive speed, analog scaling, encoder counts, robot orientation and sensor wire colors.">
<meta name="theme-color" content="#1e293b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #f1f5f9;
  --card: #ffffff;
  --text: #0f172a;
  --muted: #475569;
  --line: #e2e8f0;
  --field: #f8fafc;
  --accent: #d97706;
  --accent-text: #ffffff;
  --head: #1e293b;
  --head-text: #f8fafc;
  --error: #b91c1c;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1120;
    --card: #162032;
    --text: #e2e8f0;
    --muted: #cbd5e1;
    --line: #334155;
    --field: #0f192b;
    --accent: #f59e0b;
    --accent-text: #111827;
    --head: #0f172a;
    --head-text: #f8fafc;
    --error: #f87171;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1120;
  --card: #162032;
  --text: #e2e8f0;
  --muted: #cbd5e1;
  --line: #334155;
  --field: #0f192b;
  --accent: #f59e0b;
  --accent-text: #111827;
  --head: #0f172a;
  --head-text: #f8fafc;
  --error: #f87171;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; }

/* ---- Header with theme switch ---- */
header {
  background: var(--head);
  color: var(--head-text);
  padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
header h1 {
  margin: 0;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: .02em;
  white-space: nowrap;
  text-transform: uppercase;
}
#theme {
  border: 1px solid rgba(255,255,255,.25);
  background: transparent;
  color: var(--head-text);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}

/* ---- Result bar: only while the keypad is open, just above it ---- */
#bar {
  position: fixed;
  left: 0;
  right: 0;
  top: 0;
  z-index: 30;
  box-shadow: 0 -4px 12px rgba(0,0,0,.25);
  background: var(--accent);
  color: var(--accent-text);
  padding: 8px 16px;
  display: flex;
  justify-content: center;
  align-items: baseline;
  gap: 8px;
  font-weight: 700;
  font-size: 18px;
}
#bar small { font-size: 14px; font-weight: 600; opacity: .85; }
#bar:not(.show) { display: none; }
#bar.long { font-size: 15px; flex-wrap: wrap; text-align: center; }


main {
  max-width: 520px;
  margin: 0 auto;
  padding: 16px 16px 8px;
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 14px;
}
.card-top { display: flex; justify-content: flex-end; margin: -6px -6px 4px 0; }
.reset {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 14px;
  font-weight: 600;
  text-decoration: underline;
  padding: 4px 6px;
  cursor: pointer;
}
.seg-label { font-size: 16px; font-weight: 600; color: var(--text); margin: 0 0 6px; text-align: center; }
.seg {
  display: flex;
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 3px;
  margin-bottom: 14px;
}
.seg button {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--text);
  font-size: 17px;
  font-weight: 600;
  padding: 11px 6px;
  border-radius: 8px;
  cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
label.field { display: block; margin-bottom: 12px; }
label.field > span { display: block; font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 4px; text-align: center; }
.inwrap { position: relative; }
.inwrap input {
  width: 100%;
  font: inherit;
  font-size: 24px;
  font-weight: 600;
  color: var(--text);
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 52px;
  text-align: center;
}
.inwrap input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.inwrap input.bad { border: 2px solid var(--error); outline-color: var(--error); }
.fielderr { display: none; color: var(--error); font-size: 14px; font-weight: 600; text-align: center; margin-top: 4px; }
.fielderr.show { display: block; }
.inwrap em {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-style: normal;
  color: var(--muted);
  font-size: 16px;
  font-weight: 600;
  pointer-events: none;
}
/* - / + step buttons on the FPM boxes */
.inwrap.stepper input { padding-left: 56px; padding-right: 96px; }
.inwrap.stepper em { right: 56px; }
.step {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--card);
  color: var(--text);
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}
.step.down { left: 6px; }
.step.up { right: 6px; }
.step:active { background: var(--accent); color: var(--accent-text); }
/* ---- Wires tab ---- */
.wires { display: flex; flex-direction: column; gap: 8px; }
.wire {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px;
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 10px;
  text-align: left;
}
.wire .pin {
  flex: 0 0 auto;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-text);
  font-size: 20px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}
.wire .swatch {
  flex: 0 0 auto;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  border: 2px solid var(--line);
}
.wire .winfo b { display: block; font-size: 18px; }
.wire .winfo b small { font-size: 14px; color: var(--muted); font-weight: 600; }
.wire .winfo span { font-size: 15px; color: var(--muted); }
.inwrap input.paste { font-size: 18px; padding-left: 12px; padding-right: 12px; }
.pm {
  position: absolute;
  left: 6px;
  top: 50%;
  transform: translateY(-50%);
  width: 40px;
  height: 40px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--card);
  color: var(--text);
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
}

/* ---- Results ---- */
.results { text-align: center; }
.results h2, .about summary {
  margin: 0 0 10px;
  font-size: 15px;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--muted);
}
.big { font-size: 44px; font-weight: 700; line-height: 1.1; }
.big small { font-size: 22px; font-weight: 600; color: var(--muted); }
.big-label { font-size: 16px; font-weight: 600; color: var(--muted); margin-bottom: 2px; }
.alt { color: var(--muted); font-size: 18px; margin-top: 2px; }
.tap { cursor: pointer; border-radius: 8px; }
.tap:active { background: var(--field); }
.hint { font-size: 13px; color: var(--muted); margin-top: 10px; }
.rows { margin-top: 14px; border-top: 1px solid var(--line); text-align: left; }
.row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0;
  font-size: 17px;
  border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: 0; }
.row .k { color: var(--muted); }
.row .v { text-align: right; font-weight: 600; }
.row .v div { font-weight: 400; color: var(--muted); font-size: 16px; }
.err { color: var(--error); font-weight: 600; }
.grid { display: grid; gap: 8px; margin-top: 6px; }
.grid.g4 { grid-template-columns: 1fr 1fr; }
.grid.g3 { grid-template-columns: 1fr 1fr 1fr; }
.cell {
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 6px;
}
.cell b { display: block; font-size: 14px; color: var(--muted); }
.cell span { font-size: 20px; font-weight: 700; word-break: break-all; }
.copy {
  display: block;
  width: 100%;
  margin-top: 10px;
  border: 0;
  border-radius: 10px;
  background: var(--accent);
  color: var(--accent-text);
  font-size: 17px;
  font-weight: 700;
  padding: 12px;
  cursor: pointer;
}
.copy.alt2 { background: transparent; color: var(--text); border: 1px solid var(--line); }

/* ---- Collapsible "How it works" ---- */
.about summary { cursor: pointer; text-align: center; list-style: none; margin: 0; }
.about summary::-webkit-details-marker { display: none; }
.about summary::after { content: " \25BE"; }
.about[open] summary { margin-bottom: 10px; }
.about[open] summary::after { content: " \25B4"; }
.about p { margin: 0 0 10px; font-size: 16px; line-height: 1.5; }
.about p:last-child { margin-bottom: 0; }
.about .formula {
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
  font-weight: 600;
  text-align: center;
}

#ver {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  opacity: .6;
  padding: 0 16px calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));
}

/* ---- Bottom tab bar ---- */
nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 10;
  display: flex;
  background: var(--head);
  border-top: 1px solid rgba(255,255,255,.08);
  padding-bottom: env(safe-area-inset-bottom);
}
nav button {
  flex: 1;
  height: var(--nav-h);
  border: 0;
  background: transparent;
  color: var(--head-text);
  opacity: .7;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  cursor: pointer;
  border-top: 3px solid transparent;
}
nav button svg { width: 24px; height: 24px; }
/* Hide the tab bar while the keypad is open so it can't pop up over it */
body.typing nav { display: none; }
/* Extra room at the bottom while typing so even the last box can be
   scrolled up above the keypad */
body.typing main { padding-bottom: 60vh; }
nav button[aria-selected="true"] { opacity: 1; color: var(--accent); border-top-color: var(--accent); }

/* ---- Page tabs for the open group (under the header) ---- */
#pages {
  display: flex;
  gap: 6px;
  padding: 0 16px 12px;
  background: var(--head);
  overflow-x: auto;
  scrollbar-width: none;
}
#pages::-webkit-scrollbar { display: none; }
#pages:empty { display: none; }
#pages button {
  flex: 1 0 auto;
  border: 1px solid rgba(255,255,255,.2);
  background: transparent;
  color: var(--head-text);
  border-radius: 999px;
  padding: 8px 14px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
#pages button[aria-selected="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

/* ---- History ---- */
.hist .hrow {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 0;
  border-top: 1px solid var(--line);
  cursor: pointer;
}
.hist .hrow:first-of-type { border-top: 0; }
.hist .hres { font-weight: 700; font-size: 17px; }
.hist .hin { font-size: 14px; color: var(--muted); margin-top: 2px; }
.hist .htime { font-size: 13px; color: var(--muted); white-space: nowrap; }
.hist .hempty { color: var(--muted); font-size: 15px; text-align: center; margin: 0; }
.hist .hclear { display: block; margin: 8px auto 0; }
.warnrow { color: var(--error); font-weight: 600; font-size: 15px; margin-top: 10px; text-align: center; }

/* ---- Small "Copied" message ---- */
#toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  background: var(--text);
  color: var(--bg);
  padding: 8px 16px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 15px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
  z-index: 20;
}
#toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>Automation Tools</h1>
  <button id="theme" type="button"></button>
</header>
<div id="pages" role="tablist"></div>
<div id="bar"></div>
<main id="app"></main>
<footer id="ver"></footer>
<nav role="tablist">
  <button role="tab" data-group="conv">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="13" width="20" height="5" rx="2.5"/><circle cx="5.5" cy="15.5" r="1"/><circle cx="18.5" cy="15.5" r="1"/><rect x="8" y="6" width="8" height="7" rx="1"/></svg>
    Conveyor</button>
  <button role="tab" data-group="ctrl">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h2M7 13h2M7 17h2"/><path d="M13 8l4 0M13 12h4M13 16h4"/></svg>
    Controls</button>
  <button role="tab" data-group="robot">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h8"/><path d="M8 20v-5"/><circle cx="8" cy="13" r="2"/><path d="M9.5 11.5l5-5"/><circle cx="16" cy="5" r="2"/><path d="M17.5 6.5l2.5 2.5"/></svg>
    Robot</button>
</nav>
<div id="toast"></div>
<script src="version.js"></script>

<script>
// ---- Rounding (conveyor tabs: half rounds up, like the TI version) ----
function fmt(x, d) {
  var m = Math.abs(x) * Math.pow(10, d);
  // Tiny nudge so values like 6.645 (stored as 6.64499...) round up
  var n = Math.floor(m + 0.5 + m * 1e-12);
  var s = String(n);
  if (d) {
    while (s.length < d + 1) s = "0" + s;
    s = s.slice(0, -d) + "." + s.slice(-d);
  }
  if (x < 0 && n) s = "-" + s;
  return s;
}
function rnd(x, d) { return parseFloat(fmt(x, d)); }
// Robot tab only: plain JavaScript rounding to d places with trailing
// zeros dropped (0.022260 -> 0.02226), like quat2euler.com.
function plain(x, d) {
  var s = String(parseFloat(x.toFixed(d)));
  return s === "-0" ? "0" : s;
}

var MM = 25.4;
// Defaults match the TI program. Lengths are stored in inches.
var DEF = {
  tab: 1,
  theme: "auto",
  c1: { u: "in", m: "spd", L: 12, g: 0, r: 100, f: 100 },
  c2: { u: "in", L: 12, g: 0, f: 100 },
  c3: { u: "in", m: "gap", L: 12, gA: 0, a: 50, b: 100, gw: 12, adj: "B" },
  c4: { m: "e2q", x: 0, y: 0, z: 0, q1: 1, q2: 0, q3: 0, q4: 0 },
  c5: { pins: 4 },
  c6: { u: "in", m: "fpm", rpm: 1750, hz0: 60, ratio: 20, D: 4, hz: 60, f: 100 },
  c7: { t: "ma", m: "s2v", sl: 0, sh: 27648, el: 0, eh: 100, sig: 12, val: 50 },
  c8: { u: "in", x: 4, ppr: 1024, D: 4, dist: 12, f: 100 },
  hist: {},
  last: { conv: 1, ctrl: 7, robot: 4 } // last page opened in each group
};
var KEY = "autotools-v1";
var S = JSON.parse(JSON.stringify(DEF));
try {
  // Older versions saved under "convcalc-v1"; carry those values over
  var saved = JSON.parse(localStorage.getItem(KEY) || localStorage.getItem("convcalc-v1") || "null");
  if (saved) {
    ["c1", "c2", "c3", "c4", "c5", "c6", "c7", "c8"].forEach(function (c) {
      if (saved[c]) for (var k in S[c]) if (k in saved[c]) S[c][k] = saved[c][k];
    });
    if (saved.tab) S.tab = saved.tab;
    if (saved.theme) S.theme = saved.theme;
    if (saved.hist) S.hist = saved.hist;
    if (saved.last) for (var g in S.last) if (saved.last[g]) S.last[g] = saved.last[g];
  }
} catch (e) {}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}

// ---- Field definitions per calculator ----
// len: length (stored in inches, shown in chosen unit, 2 decimals)
// neg: negatives allowed; raw: kept exactly as typed (no rounding)
var FIELDS = {
  c1spd: [
    { k: "L", label: "Product length", len: true },
    { k: "g", label: "Gap", len: true },
    { k: "r", label: "Parts/min", d: 0, unit: "ppm" }
  ],
  c1rate: [
    { k: "L", label: "Product length", len: true },
    { k: "g", label: "Gap", len: true },
    { k: "f", label: "Speed", d: 0, unit: "FPM" }
  ],
  c2: [
    { k: "L", label: "Product length", len: true },
    { k: "g", label: "Gap between products", len: true },
    { k: "f", label: "Speed", d: 0, unit: "FPM" }
  ],
  c3gap: [
    { k: "L", label: "Product length", len: true },
    { k: "gA", label: "Gap on A", len: true },
    { k: "a", label: "Speed A", d: 0, unit: "FPM" },
    { k: "b", label: "Speed B", d: 0, unit: "FPM" }
  ],
  c3spdA: [
    { k: "L", label: "Product length", len: true },
    { k: "gA", label: "Gap A Current", len: true },
    { k: "gw", label: "Gap B Desired", len: true },
    { k: "b", label: "Speed B (current)", d: 0, unit: "FPM" }
  ],
  c3spdB: [
    { k: "L", label: "Product length", len: true },
    { k: "gA", label: "Gap A Current", len: true },
    { k: "gw", label: "Gap B Desired", len: true },
    { k: "a", label: "Speed A (current)", d: 0, unit: "FPM" }
  ],
  c4e: [
    { k: "x", label: "X angle", unit: "°", neg: true, raw: true },
    { k: "y", label: "Y angle", unit: "°", neg: true, raw: true },
    { k: "z", label: "Z angle", unit: "°", neg: true, raw: true }
  ],
  c6fpm: [
    { k: "rpm", label: "Motor nameplate RPM", d: 0, unit: "RPM" },
    { k: "hz0", label: "Motor base frequency", d: 0, unit: "Hz" },
    { k: "ratio", label: "Gear ratio (input : 1)", d: 2, unit: ": 1" },
    { k: "D", label: "Drum / sprocket diameter", len: true },
    { k: "hz", label: "Drive frequency", d: 1, unit: "Hz" }
  ],
  c6hz: [
    { k: "rpm", label: "Motor nameplate RPM", d: 0, unit: "RPM" },
    { k: "hz0", label: "Motor base frequency", d: 0, unit: "Hz" },
    { k: "ratio", label: "Gear ratio (input : 1)", d: 2, unit: ": 1" },
    { k: "D", label: "Drum / sprocket diameter", len: true },
    { k: "f", label: "Target speed", d: 0, unit: "FPM" }
  ],
  c8: [
    { k: "ppr", label: "Encoder pulses per rev", d: 0, unit: "PPR" },
    { k: "D", label: "Measuring wheel / drum diameter", len: true },
    { k: "dist", label: "Distance to count", len: true },
    { k: "f", label: "Belt speed", d: 0, unit: "FPM" }
  ],
  c4q: [
    { k: "q1", label: "q1", unit: "", neg: true, raw: true },
    { k: "q2", label: "q2", unit: "", neg: true, raw: true },
    { k: "q3", label: "q3", unit: "", neg: true, raw: true },
    { k: "q4", label: "q4", unit: "", neg: true, raw: true }
  ]
};

// Analog scaling fields depend on the signal type
var SIG = { ma: [4, 20, "mA", 3], v: [0, 10, "V", 3], raw: [null, null, "counts", 0] };
function analogFields() {
  var a = S.c7, u = SIG[a.t][2], list = [];
  if (a.t === "raw") {
    list.push({ k: "sl", label: "Signal low (counts)", unit: "", neg: true, raw: true });
    list.push({ k: "sh", label: "Signal high (counts)", unit: "", neg: true, raw: true });
  }
  list.push({ k: "el", label: "Value at signal low", unit: "", neg: true, raw: true });
  list.push({ k: "eh", label: "Value at signal high", unit: "", neg: true, raw: true });
  if (a.m === "s2v") list.push({ k: "sig", label: "Signal reading", unit: u, neg: a.t === "raw", raw: true });
  else list.push({ k: "val", label: "Value", unit: "", neg: true, raw: true });
  return list;
}

}

function kOf(c) { return S[c].u === "mm" ? 1 / MM : 1; } // inches per unit

function copyText(text, msg) {

  function fallback() {

function fieldEl(c, f) {

  wrap.className = "inwrap";

  function mark(bad) {
    inp.classList.toggle("bad", bad);
    msg.classList.toggle("show", bad);
  }
  inp.addEventListener("focus", function () { inp.select(); });
  inp.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); nextBox(inp); }
  });
  inp.addEventListener("input", function () {
    var t = inp.value.trim();
    var v = Number(t);
    if (t === "" || !isFinite(v) || (v < 0 && !f.neg)) {
      invalid[c + f.k] = true;
      mark(true);
    } else {
      delete invalid[c + f.k];
      mark(false);
      // Conveyor tabs round entries to the shown decimals first (like the TI)
      S[c][f.k] = f.raw ? v : f.len ? rnd(v, 2) * kOf(c) : rnd(v, f.d);
      save();
      scheduleHist();
      var pb = document.getElementById("qpaste");
      if (pb && pb !== document.activeElement) pb.value = qText();
    }
    renderResults();
  });
  inp.addEventListener("blur", function () {
    delete invalid[c + f.k];
    mark(false);
    inp.value = shown(c, f);
    renderResults();
  });
  wrap.appendChild(inp);
  wrap.appendChild(em);
  if (f.unit === "FPM") {
    // - / + buttons: tap to change by 1 FPM, hold to keep going
    wrap.classList.add("stepper");
    [["down", "−", -1], ["up", "+", 1]].forEach(function (b) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "step " + b[0];
      btn.textContent = b[1];
      btn.setAttribute("aria-label", (b[2] > 0 ? "Increase " : "Decrease ") + f.label + " by 1");
      var hold, rep;
      function bump() {
        var v = Math.max(0, S[c][f.k] + b[2]);
        inp.value = fmt(v, 0);
        inp.dispatchEvent(new Event("input"));
        if (document.activeElement !== inp) inp.value = shown(c, f);
      }
      function stop() { clearTimeout(hold); clearInterval(rep); }
      btn.addEventListener("pointerdown", function (e) {
        e.preventDefault(); // don't steal focus or open the keypad
        bump();
        hold = setTimeout(function () { rep = setInterval(bump, 80); }, 400);
      });
      ["pointerup", "pointerleave", "pointercancel"].forEach(function (ev) {
        btn.addEventListener(ev, stop);
      });
      wrap.appendChild(btn);
    });
  }
  if (f.neg) {
    // Some number pads have no minus key, so give negatives a button
    var pm = document.createElement("button");
    pm.type = "button";
    pm.className = "pm";
    pm.textContent = "±";
    pm.setAttribute("aria-label", "Make " + f.label + " negative or positive");
    pm.addEventListener("mousedown", function (e) { e.preventDefault(); });
    pm.onclick = function () {
      var t = inp.value.trim();
      inp.value = t.charAt(0) === "-" ? t.slice(1) : "-" + t;
      inp.dispatchEvent(new Event("input"));
      if (document.activeElement !== inp) inp.value = shown(c, f);
    };
    wrap.appendChild(pm);
  }
  lab.appendChild(sp);
  lab.appendChild(wrap);
  lab.appendChild(msg);
  return lab;
}

// One box to paste a whole quaternion, e.g. [0.707107, 0, 0, 0.707107]
function pasteEl() {
  var lab = document.createElement("label");
  lab.className = "field";
  lab.innerHTML = "<span>Paste quaternion [q1, q2, q3, q4]</span>";
  var wrap = document.createElement("div");
  wrap.className = "inwrap";
  var inp = document.createElement("input");
  inp.type = "text";
  inp.id = "qpaste";
  inp.autocomplete = "off";
  inp.enterKeyHint = "next";
  inp.className = "paste";
  inp.value = qText();
  var msg = document.createElement("div");
  msg.className = "fielderr";
  msg.textContent = "Paste 4 numbers, like [1, 0, 0, 0]";
  inp.addEventListener("focus", function () { inp.select(); });
  inp.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); nextBox(inp); }
  });
  inp.addEventListener("input", function () {
    var n = inp.value.match(/-?\d*\.?\d+(?:e-?\d+)?/gi);
    var bad = !n || n.length !== 4;
    inp.classList.toggle("bad", bad);
    msg.classList.toggle("show", bad);
    if (bad) { invalid.qpaste = true; renderResults(); return; }
    delete invalid.qpaste;
    scheduleHist();
    ["q1", "q2", "q3", "q4"].forEach(function (k, i) {
      S.c4[k] = Number(n[i]);
      var box = app.querySelector('input[data-k="' + k + '"]');
      if (box) box.value = String(S.c4[k]);
      delete invalid["c4" + k];
    });
    save();
    renderResults();
  });
  inp.addEventListener("blur", function () {
    delete invalid.qpaste;
    inp.classList.remove("bad");
    msg.classList.remove("show");
    inp.value = qText();
    renderResults();
  });
  wrap.appendChild(inp);
  lab.appendChild(wrap);
  lab.appendChild(msg);
  return lab;
}

// ABB convention (RAPID OrientZYX / EulerZYX): rotate about Z, then Y, then X.
// q1 is the scalar part. Matches quat2euler.com.
function eulerToQuat(xd, yd, zd) {
  var r = Math.PI / 360; // degrees -> half-angle radians
  var cx = Math.cos(xd * r), sx = Math.sin(xd * r);
  var cy = Math.cos(yd * r), sy = Math.sin(yd * r);
  var cz = Math.cos(zd * r), sz = Math.sin(zd * r);
  return [
    cz * cy * cx + sz * sy * sx,
    cz * cy * sx - sz * sy * cx,
    cz * sy * cx + sz * cy * sx,
    sz * cy * cx - cz * sy * sx
  ];
}
function quatToEuler(q) {
  var w = q[0], x = q[1], y = q[2], z = q[3], d = 180 / Math.PI;
  var s = Math.max(-1, Math.min(1, 2 * (w * y - z * x)));
  return [
    Math.atan2(2 * (w * x + y * z), 1 - 2 * (x * x + y * y)) * d,
    Math.asin(s) * d,
    Math.atan2(2 * (w * z + x * y), 1 - 2 * (y * y + z * z)) * d
  ];
}

function groupOf(t) {

// ---- History: the last 10 results on each calculator ----
// A result is saved a moment after you stop changing the entries.
// Tap a saved result to put its entries back.
var histBox = null, histT, lastSum = null;
function histKey() { return "c" + S.tab; }
function inputsText() {
  var c = histKey();
  return curList.map(function (f) {
    var u = f.len ? S[c].u : f.unit;
    return f.label + " " + shown(c, f) + (u ? " " + u : "");
  }).join(" · ");
}
function scheduleHist() {
  clearTimeout(histT);
  histT = setTimeout(addHist, 2000);
}
function addHist() {
  if (!lastSum || !histBox || Object.keys(invalid).length) return;
  var c = histKey();
  var list = S.hist[c] || (S.hist[c] = []);
  var e = { t: Date.now(), r: (lastSum[0] ? lastSum[0] + ": " : "") + lastSum[1], i: inputsText(),
    s: JSON.parse(JSON.stringify(S[c])) };
  if (list.length && list[0].r === e.r && list[0].i === e.i) return;
  list.unshift(e);
  if (list.length > 10) list.length = 10;
  save();
  renderHist();
}
function renderHist() {
  if (!histBox) return;
  var c = histKey(), list = S.hist[c] || [];
  var h = "<summary>History" + (list.length ? " (" + list.length + ")" : "") + "</summary>";
  if (!list.length) h += '<p class="hempty">Results you work out are saved here.</p>';
  list.forEach(function (e, n) {
    var d = new Date(e.t);
    var tm = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    if (new Date().toDateString() !== d.toDateString())
      tm = d.toLocaleDateString([], { month: "numeric", day: "numeric" }) + " " + tm;
    h += '<div class="hrow" data-n="' + n + '"><div><div class="hres">' + e.r + '</div><div class="hin">' +
      e.i + '</div></div><div class="htime">' + tm + "</div></div>";
  });
  if (list.length) h += '<button type="button" class="reset hclear">Clear history</button>';
  var wasOpen = histBox.open;
  histBox.innerHTML = h;
  histBox.open = wasOpen;
  histBox.querySelectorAll(".hrow").forEach(function (el) {
    el.onclick = function () {
      S[c] = JSON.parse(JSON.stringify(list[+el.dataset.n].s));
      save();
      render();
      toast("Entries restored");
    };
  });
  var cl = histBox.querySelector(".hclear");
  if (cl) cl.onclick = function () { S.hist[c] = []; save(); renderHist(); };
}

      fm("Counts per inch = counts per rev &divide; (&pi; &times; diameter)") +
      p("&times;4 (quadrature) counts every edge of both channels. Input frequency is the A-channel " +
        "pulse rate at that speed; keep it under the PLC's high-speed counter limit.");
  }
  if (S.tab === 4) {
    return p("Converts between X, Y, Z angles in degrees and the quaternion [q1, q2, q3, q4] " +
        "used by ABB robot orient data. q1 is the scalar part, and [1, 0, 0, 0] means no rotation.") +
      p("Angles follow ABB's Z-Y-X order, the same as RAPID's OrientZYX and EulerZYX: " +
        "rotate about Z, then Y, then X. Results match quat2euler.com.") +
      fm("q = Rz(Z) &times; Ry(Y) &times; Rx(X)") +
      p("Quaternions you enter are normalized first, so q1&sup2; + q2&sup2; + q3&sup2; + q4&sup2; = 1. " +
        "Values are shown to 6 decimal places. Note that OrientZYX takes the angles as Z, Y, X.");
  }
  if (S.c3.m === "gap") {
    return p("Finds the gap you get when product moves from conveyor A onto conveyor B " +
        "running at a different speed. The time between products stays the same, " +
        "so the spacing stretches (or shrinks) by B &divide; A.") +
      fm("Gap on B = (length + gap on A) &times; B &divide; A &minus; length") +
      p("A negative gap means products would collide or back up on B.");
  }
  return p("Finds the speed to run one conveyor so the gap on B becomes the gap you want. " +
      "Choose which conveyor to adjust, then enter the current speed of the other one.") +
    fm("Factor = (length + desired gap B) &divide; (length + current gap A)") +
    fm("Adjust B: B = A &times; factor &nbsp;&middot;&nbsp; Adjust A: A = B &divide; factor") +
    p("Assumes products leave A with the gap you entered and take on B's speed " +
      "as soon as they reach it.");
}

// Dual-unit text: chosen unit first, other in brackets
function dual(c, x) {
  var a = fmt(x, 2) + " in", b = fmt(x * MM, 2) + " mm";
  if (S[c].u === "mm") { var t = a; a = b; b = t; }
  return [a, "[" + b + "]"];
}
function esc(t) { return String(t).replace(/"/g, "&quot;"); }
// Tap any result to copy it
function row(k, v, sub, copy) {
  return '<div class="row"><span class="k">' + k + '</span><span class="v tap" data-copy="' +
    esc(copy || v) + '">' + v + (sub ? "<div>" + sub + "</div>" : "") + "</span></div>";
}
function big(label, val, unit, alt) {
  return '<div class="big-label">' + label + '</div><div class="big tap" data-copy="' +
    esc(val + " " + unit) + '">' + val + " <small>" + unit + "</small></div>" +
    (alt ? '<div class="alt tap" data-copy="' + esc(alt) + '">' + alt + "</div>" : "");
}
function ms(lenIn, fpm) { return lenIn / 12 / fpm * 60000; }

function renderResults() {
  var h = "<h2>Results</h2>";
  var sum = null; // [label, value] for the slim bar
  if (Object.keys(invalid).length) {
    resultsBox.innerHTML = h + '<p class="err">Fix the highlighted box.</p>';
    setBar(["Results", "Fix the highlighted box"]);
    lastSum = null;
    return;
  }
  var div0 = '<p class="err">Can\'t divide by 0 &mdash; check your entries.</p>';
  function stop() { resultsBox.innerHTML = h + div0; setBar(["Results", "Can't divide by 0"]); lastSum = null; }
  var copies = []; // [button text, text to copy]

  if (S.tab === 1) {
    var p = S.c1.L + S.c1.g;
    if (S.c1.m === "spd") {
      var f = rnd(S.c1.r * p / 12, 0);
      h += big("Speed", fmt(f, 0), "FPM", fmt(f * 0.3048, 1) + " m/min");
      sum = ["Speed", fmt(f, 0) + " FPM"];
    } else {
      if (p === 0) return stop();
      var r = S.c1.f * 12 / p;
      h += big("Rate", fmt(r, 1), "parts/min");
      sum = ["Rate", fmt(r, 1) + " ppm"];
    }
  } else if (S.tab === 2) {
    if (S.c2.f === 0) return stop();
    var t = ms(S.c2.L, S.c2.f), tg = ms(S.c2.g, S.c2.f);
    var d2 = dual("c2", S.c2.L);
    h += big("Sensor block time", fmt(t, 1), "ms");
    h += '<div class="rows">' + row("Gap time", fmt(tg, 1) + " ms") +
      row("Length", d2[0], d2[1], d2[0]) + row("Speed", fmt(S.c2.f, 0) + " FPM") + "</div>";
    sum = ["Block", fmt(t, 1) + " ms"];
  } else if (S.tab === 3) {
    var s = S.c3;
    if (s.m === "gap") {
      // gap B = (len + gap A) x B/A - len
      if (s.a === 0) return stop();
      var n = (s.L + s.gA) * s.b / s.a - s.L;
      var g1 = dual("c3", n), g2 = dual("c3", n - s.gA);
      h += big("Gap on B", g1[0].split(" ")[0], g1[0].split(" ")[1], g1[1]);
      h += '<div class="rows">' + row("Added", g2[0], g2[1], g2[0]) +
        row("Ratio (B/A)", fmt(s.b / s.a, 3)) + "</div>";
      sum = ["Gap on B", g1[0]];
    } else {
      // factor = (len + gap B desired) / (len + gap A); B = A x f, A = B / f
      if (s.L + s.gA === 0 || s.L + s.gw === 0) return stop();
      var F = (s.L + s.gw) / (s.L + s.gA);
      var v = s.adj === "B" ? s.a * F : s.b / F;
      var g3 = dual("c3", s.gw - s.gA);
      h += big("Set speed " + s.adj + " to", fmt(v, 0), "FPM");
      h += '<div class="rows">' + row("Added", g3[0], g3[1], g3[0]) +
        row("Factor (B/A)", fmt(F, 4)) + "</div>";
      sum = ["Set " + s.adj + " to", fmt(v, 0) + " FPM"];
    }
  } else if (S.tab === 6) {
    var d6 = S.c6;
    if (d6.hz0 === 0 || d6.ratio === 0) return stop();
    var perHz = d6.rpm / d6.hz0 / d6.ratio * Math.PI * d6.D / 12; // FPM per Hz
    if (d6.m === "fpm") {
      var mr = d6.rpm * d6.hz / d6.hz0, fp = rnd(mr / d6.ratio * Math.PI * d6.D / 12, 0);
      h += big("Belt speed", fmt(fp, 0), "FPM", fmt(fp * 0.3048, 1) + " m/min");
      h += '<div class="rows">' + row("Motor speed", fmt(mr, 0) + " RPM") +
        row("Gearbox output", fmt(mr / d6.ratio, 1) + " RPM") +
        row("FPM per Hz", fmt(perHz, 2)) + "</div>";
      sum = ["Belt", fmt(fp, 0) + " FPM"];
    } else {
      if (perHz === 0) return stop();
      var hz = d6.f / perHz, mr2 = d6.rpm * hz / d6.hz0;
      h += big("Set drive to", fmt(hz, 1), "Hz");
      h += '<div class="rows">' + row("Motor speed", fmt(mr2, 0) + " RPM") +
        row("Gearbox output", fmt(mr2 / d6.ratio, 1) + " RPM") +
        row("FPM per Hz", fmt(perHz, 2)) + "</div>";
      if (hz > d6.hz0) h += '<div class="warnrow">Above the motor\'s ' + fmt(d6.hz0, 0) + ' Hz base frequency</div>';
      sum = ["Drive", fmt(hz, 1) + " Hz"];
    }
  } else if (S.tab === 7) {
    var a7 = S.c7, rg = sigRange(), su = SIG[a7.t][2], sd = SIG[a7.t][3];
    if (rg[1] === rg[0] || a7.eh === a7.el) return stop();
    var sig, val;
    if (a7.m === "s2v") {
      sig = a7.sig;
      val = a7.el + (sig - rg[0]) * (a7.eh - a7.el) / (rg[1] - rg[0]);
      h += big("Value", plain(val, 3), "");
      sum = ["Value", plain(val, 3)];
    } else {
      val = a7.val;
      sig = rg[0] + (val - a7.el) * (rg[1] - rg[0]) / (a7.eh - a7.el);
      h += big("Signal", plain(sig, sd), su);
      sum = ["Signal", plain(sig, sd) + " " + su];
    }
    var pct = (sig - rg[0]) / (rg[1] - rg[0]) * 100;
    h += '<div class="rows">' + row("Percent of span", plain(pct, 1) + " %") +
      (a7.m === "s2v" ? row("Signal", plain(sig, sd) + " " + su) : row("Value", plain(val, 3))) + "</div>";
    var lo = Math.min(rg[0], rg[1]), hi = Math.max(rg[0], rg[1]);
    if (sig < lo || sig > hi)
      h += '<div class="warnrow">Outside the ' + plain(rg[0], sd) + "–" + plain(rg[1], sd) + " " + su + " range" +
        (a7.t === "ma" && sig < 3.8 ? ": check for a broken wire or failed sensor" : "") + "</div>";
  } else if (S.tab === 8) {
    var e8 = S.c8;
    if (e8.D === 0) return stop();
    var cpr = e8.ppr * e8.x, circ = Math.PI * e8.D, cpi = cpr / circ;
    var cnt = e8.dist * cpi;
    h += big("Counts for " + dual("c8", e8.dist)[0], fmt(cnt, 1), "counts");
    var per = S.c8.u === "mm" ? [fmt(cpi / MM, 4) + " per mm", fmt(cpi, 3) + " per in"]
      : [fmt(cpi, 3) + " per in", fmt(cpi / MM, 4) + " per mm"];
    var resIn = 1 / cpi;
    var resTxt = S.c8.u === "mm" ? [plain(resIn * MM, 4) + " mm", "[" + plain(resIn, 5) + " in]"]
      : [plain(resIn, 5) + " in", "[" + plain(resIn * MM, 4) + " mm]"];
    var fA = e8.f * 12 / 60 / circ * e8.ppr; // A-channel pulses per second
    h += '<div class="rows">' + row("Counts", per[0], per[1], per[0]) +
      row("Counts per foot", fmt(cpi * 12, 1)) +
      row("Counts per rev", fmt(cpr, 0)) +
      row("Resolution", resTxt[0], resTxt[1], resTxt[0]) +
      row("Input frequency at " + fmt(e8.f, 0) + " FPM", fA >= 1000 ? fmt(fA / 1000, 2) + " kHz" : fmt(fA, 0) + " Hz") + "</div>";
    sum = ["Counts", fmt(cnt, 1)];
  } else {
    var c4 = S.c4;
    if (c4.m === "e2q") {
      var q = eulerToQuat(c4.x, c4.y, c4.z).map(function (x) { return plain(x, 6); });
      h += '<div class="big-label">Quaternion</div><div class="grid g4">' +
        q.map(function (x, i) {
          return '<div class="cell tap" data-copy="' + x + '"><b>q' + (i + 1) + "</b><span>" + x + "</span></div>";
        }).join("") + "</div>";
      copies.push(["Copy [q1,q2,q3,q4]", "[" + q.join(",") + "]"]);
      copies.push(["Copy OrientZYX(Z,Y,X)", "OrientZYX(" + [c4.z, c4.y, c4.x].join(",") + ")"]);
      sum = ["Quaternion", "[" + q.join(", ") + "]"];
    } else {
      var raw = [c4.q1, c4.q2, c4.q3, c4.q4];
      var len = Math.sqrt(raw.reduce(function (a, x) { return a + x * x; }, 0));
      if (len === 0) {
        resultsBox.innerHTML = h + '<p class="err">A quaternion can\'t be all zeros.</p>';
        setBar(["Results", "Quaternion can't be all zeros"]);
        return;
      }
      var qn = raw.map(function (x) { return x / len; });
      var e = quatToEuler(qn).map(function (x) { return plain(x, 6); });
      h += '<div class="big-label">Euler angles</div><div class="grid g3">' +
        ["X", "Y", "Z"].map(function (a, i) {
          return '<div class="cell tap" data-copy="' + e[i] + '"><b>' + a + "</b><span>" + e[i] + "&deg;</span></div>";
        }).join("") + "</div>";
      h += '<div class="rows">' + row("Normalized",
        "[" + qn.map(function (x) { return plain(x, 6); }).join(", ") + "]") + "</div>";
      copies.push(["Copy [X,Y,Z]", "[" + e.join(",") + "]"]);
      copies.push(["Copy OrientZYX(Z,Y,X)", "OrientZYX(" + [e[2], e[1], e[0]].join(",") + ")"]);
      sum = ["X Y Z", e.join("°  ") + "°"];
    }
  }
  copies.forEach(function (cp, i) {
    h += '<button type="button" class="copy' + (i ? " alt2" : "") + '" data-copy="' + esc(cp[1]) + '">' + cp[0] + "</button>";
  });
  if (!copies.length) h += '<div class="hint">Tap any result to copy it</div>';
  resultsBox.innerHTML = h;
  resultsBox.querySelectorAll("[data-copy]").forEach(function (el) {
    el.onclick = function () { copyText(el.dataset.copy); };
  });
  setBar(sum);
  lastSum = sum;
}

// ---- Result bar ----
// While the keypad is open, show the result in a bar just above it.
var typing = false, barQueued = false;
function setTyping(on) {
  typing = on;
  document.body.classList.toggle("typing", on);
  placeBar();
  // Check again once the keypad has finished sliding open or closed
  setTimeout(placeBar, 400);
}
// Keep the selected box in view without needless jumps. The phone's
// browser may scroll on its own when the keypad opens; if the box would
// still be above the keypad at the scroll position it had when you tapped
// it, put the page back there. Only if the keypad really covers the box,
// scroll just enough to lift it above the keypad (plus room for the
// result bar).
// It only acts just after a box is selected while the keypad opens. Once
// you move the page yourself, it leaves the scroll alone until you pick
// another box.
var focusY = 0, adjustUntil = 0, userMoved = false;
["touchstart", "wheel"].forEach(function (ev) {
  window.addEventListener(ev, function () { userMoved = true; }, { passive: true });
});
function keepVisible() {
  var el = document.activeElement;
  if (!typing || !el || el.tagName !== "INPUT") return;
  if (userMoved || Date.now() > adjustUntil) return;
  var vv = window.visualViewport;
  var visH = vv ? vv.height : window.innerHeight;
  var r = el.getBoundingClientRect();
  var docTop = r.top + window.scrollY, docBottom = r.bottom + window.scrollY;
  if (docTop - focusY >= 0 && docBottom - focusY <= visH) {
    if (window.scrollY !== focusY) window.scrollTo(0, focusY);
  } else if (docBottom - focusY > visH) {
    window.scrollTo(0, docBottom - visH + 60);
  } else {
    window.scrollTo(0, docTop - 12);
  }
  focusY = window.scrollY;
  placeBar();
}
document.addEventListener("focusin", function (e) {
  if (e.target.tagName !== "INPUT") return;
  focusY = window.scrollY;
  userMoved = false;
  adjustUntil = Date.now() + 1000; // long enough for the keypad to open
  setTyping(true);
  keepVisible();
  // Again once the keypad is fully open
  setTimeout(keepVisible, 350);
});
document.addEventListener("focusout", function (e) {
  // Moving straight to another box keeps the keypad state
  var next = e.relatedTarget;
  if (!next || next.tagName !== "INPUT") setTyping(false);
});
function placeBar() {
  if (barQueued) return;
  barQueued = true;
  requestAnimationFrame(function () {
    barQueued = false;
    // Only shown while the keypad is open, sitting just above it
    var show = typing && !!resultsBox;
    bar.classList.toggle("show", show);
    if (!show) return;
    var vv = window.visualViewport;
    var bottom = vv ? vv.offsetTop + vv.height : window.innerHeight;
    bar.style.top = (bottom - bar.offsetHeight) + "px";
  });
}
if (window.visualViewport) {
  // The keypad opening shrinks the visible area: keep the box in view
  window.visualViewport.addEventListener("resize", keepVisible);
  window.visualViewport.addEventListener("resize", placeBar);
  window.visualViewport.addEventListener("scroll", placeBar);
}
window.addEventListener("scroll", placeBar);
window.addEventListener("resize", placeBar);

function setBar(sum) {
  bar.classList.toggle("long", S.tab === 4);
  bar.innerHTML = "<small>" + sum[0] + "</small><span>" + sum[1] + "</span>";
  placeBar();
}

function openTab(t) {
  S.tab = t; save(); render(); window.scrollTo(0, 0);
}
// A group button opens the page you last used in that group
document.querySelectorAll("nav button[data-group]").forEach(function (b) {
  b.onclick = function () { openTab(S.last[b.dataset.group]); };
});
applyTheme();
render();
if (typeof APP_VERSION === "string")
  document.getElementById("ver").textContent = APP_VERSION + (typeof APP_DATE === "string" ? " - " + APP_DATE : "");

// ---- Offline support ----
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").then(function (reg) {
      // Check for a new version whenever the app is brought back to the front
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") reg.update().catch(function () {});
      });
    }).catch(function () {});
  });
}
</script>
</body>
</html>
